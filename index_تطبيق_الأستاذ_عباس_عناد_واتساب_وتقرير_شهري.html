<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769c2">
<link rel="manifest" href="manifest.json">
<title>تطبيق الأستاذ عباس عناد</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#1769c2;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}header small{opacity:.9}
main{padding:14px;max-width:1100px;margin:auto;padding-bottom:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
nav button{flex:1;border:0;background:#fff;padding:10px 3px;font-size:12px;color:#333}
nav button b{display:block;font-size:20px;margin-bottom:2px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000010}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{font-size:13px;color:#697386}.stat strong{display:block;font-size:28px;color:#1769c2;margin-top:6px}
button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#1769c2;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#eaf2fc;color:#1769c2}.danger{background:#d92d20!important}.green{background:#198754}.orange{background:#d97706}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:10px;background:#fff;font-size:15px}
label{font-size:13px;color:#566274;display:block;margin:8px 0 5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e6eaf0;text-align:center}th{background:#f1f5f9}
.bad{color:#c62828;font-weight:bold}.good{color:#198754;font-weight:bold}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal .box{background:white;border-radius:18px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4fb;margin:2px;font-size:12px}
.hide{display:none}.small{font-size:12px;color:#6b7280}.title{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{font-size:19px}h3{font-size:16px}
@media(max-width:600px){table{font-size:11px}th,td{padding:6px}.desktop{display:none}}
</style>
</head>
<body>
<header><h1>📖 تطبيق الأستاذ عباس عناد</h1><small>إدارة الصفوف والحضور والدرجات — بدون كلمة مرور</small></header>
<main id="app"></main>
<nav>
<button onclick="go('home')"><b>🏠</b>الرئيسية</button>
<button onclick="go('classes')"><b>🎓</b>الصفوف</button>
<button onclick="go('students')"><b>👥</b>الطلاب</button>
<button onclick="go('attendance')"><b>📅</b>الحضور</button>
<button onclick="go('grades')"><b>📝</b>الدرجات</button>
<button onclick="go('reports')"><b>📊</b>التقارير</button>
<button onclick="go('settings')"><b>⚙️</b>الإعدادات</button>
</nav>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const KEY='abbas_teacher_v4';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{classes:[],students:[],attendance:[],grades:[],settings:{weights:{attendance:10,participation:10,oral:10,quiz:10,monthly:60},pass:50}};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cls(id){return db.classes.find(x=>x.id===id)}
function stu(id){return db.students.find(x=>x.id===id)}
function monthList(){return ['الشهر الأول','الشهر الثاني','الشهر الثالث','الشهر الرابع','الشهر الخامس','الشهر السادس','الشهر السابع','الشهر الثامن','الشهر التاسع','الشهر العاشر']}
function finalFor(sid,month){
 const w=db.settings.weights,g=db.grades.filter(x=>x.studentId===sid && (!month||x.month===month));
 const avg=k=>{let a=g.filter(x=>x.type===k).map(x=>+x.value).filter(x=>!isNaN(x));return a.length?a.reduce((a,b)=>a+b,0)/a.length:0};
 const att=attendanceScore(sid);
 return att*w.attendance/100+avg('participation')*w.participation/100+avg('oral')*w.oral/100+avg('quiz')*w.quiz/100+avg('monthly')*w.monthly/100;
}
function attendanceScore(sid){
 let a=db.attendance.filter(x=>x.studentId===sid);
 if(!a.length)return 0;
 let present=a.filter(x=>x.status==='present'||x.status==='late').length;
 return present/a.length*100;
}
function classSelect(selected='', fieldId='classSel'){
 return `<select id="${fieldId}"><option value="">اختر الصف</option>${db.classes.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} — ${esc(c.section||'')}</option>`).join('')}</select>`
}
function go(page){location.hash=page;render()}
window.onhashchange=render;
function render(){
 let p=location.hash.slice(1)||'home';
 if(p==='home')home(); else if(p==='classes')classes(); else if(p==='students')students(); else if(p==='attendance')attendance(); else if(p==='grades')grades(); else if(p==='reports')reports(); else settings();
}
function home(){
 const avg=db.students.length?db.students.reduce((a,s)=>a+finalFor(s.id,null),0)/db.students.length:0;
 const today=new Date().toISOString().slice(0,10), present=db.attendance.filter(a=>a.date===today&&a.status!=='absent').length;
 app.innerHTML=`<div class="card"><div class="title"><div><h2>الرئيسية</h2><div class="small">كل ما تحتاجه لإدارة طلابك في مكان واحد</div></div><button onclick="backup()">💾 نسخة احتياطية</button></div></div>
 <div class="grid">
 <div class="card stat">الصفوف<strong>${db.classes.length}</strong></div>
 <div class="card stat">الطلاب<strong>${db.students.length}</strong></div>
 <div class="card stat">حاضر اليوم<strong>${present}</strong></div>
 <div class="card stat">المعدل العام<strong>${avg.toFixed(1)}</strong></div>
 </div>
 <div class="card"><h3>الحساب المعتمد</h3><p>حضور <b>${db.settings.weights.attendance}%</b> + مشاركة <b>${db.settings.weights.participation}%</b> + شفهي <b>${db.settings.weights.oral}%</b> + Quiz <b>${db.settings.weights.quiz}%</b> + شهري <b>${db.settings.weights.monthly}%</b> = <b>100%</b></p></div>
 <div class="card"><h3>اختصارات</h3><div class="row"><button onclick="go('classes')">🎓 إدارة الصفوف</button><button onclick="go('students')">👥 إدارة الطلاب</button><button onclick="go('attendance')">📅 حضور اليوم</button><button onclick="go('grades')">📝 إدخال الدرجات</button><button onclick="go('reports')">📊 كشف وترتيب</button></div></div>`
}
function classes(){
 app.innerHTML=`<div class="card"><div class="title"><h2>الصفوف والشعب</h2><button onclick="addClass()">+ صف جديد</button></div>
 <div>${db.classes.length?db.classes.map(c=>`<div class="card"><div class="title"><div><b>${esc(c.name)}</b> <span class="pill">${esc(c.section||'بدون شعبة')}</span><div class="small">${db.students.filter(s=>s.classId===c.id).length} طالب</div></div><div><button class="secondary" onclick="editClass('${c.id}')">تعديل</button> <button class="danger" onclick="delClass('${c.id}')">حذف</button></div></div></div>`).join(''):'<p class="small">لا توجد صفوف بعد.</p>'}</div></div>`
}
function addClass(existing){
 open(`<h2>${existing?'تعديل الصف':'إضافة صف'}</h2><label>اسم الصف</label><input id="cn" value="${esc(existing?.name||'')}"><label>الشعبة</label><input id="cs" value="${esc(existing?.section||'')}"><div class="row" style="margin-top:12px"><button onclick="saveClass('${existing?.id||''}')">حفظ</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function saveClass(cid){let n=cn.value.trim();if(!n)return alert('اكتب اسم الصف');if(cid){let c=cls(cid);c.name=n;c.section=cs.value.trim()}else db.classes.push({id:id(),name:n,section:cs.value.trim()});save();closeM();classes()}
function editClass(i){addClass(cls(i))}
function delClass(i){if(confirm('حذف الصف؟ سيتم حذف طلابه ودرجاتهم وحضوره.')){db.students=db.students.filter(s=>s.classId!==i);db.classes=db.classes.filter(c=>c.id!==i);db.attendance=db.attendance.filter(a=>stu(a.studentId));db.grades=db.grades.filter(g=>stu(g.studentId));save();classes()}}
function students(){
 app.innerHTML=`<div class="card"><div class="title"><h2>الطلاب</h2><div class="row"><button onclick="addStudent()">+ طالب</button><button class="secondary" onclick="bulkStudents()">+ إضافة بالجملة</button></div></div>
 <label>تصفية حسب الصف</label>${classSelect()}<div id="studentList"></div></div>`;
 classSel.onchange=drawStudents;drawStudents()
}
function drawStudents(){
 let cid=classSel.value, arr=db.students.filter(s=>!cid||s.classId===cid);
 studentList.innerHTML=arr.length?`<table><thead><tr><th>#</th><th>الاسم</th><th>الصف</th><th>الدرجة</th><th>إجراء</th></tr></thead><tbody>${arr.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(cls(s.classId)?.name||'')}</td><td>${finalFor(s.id,null).toFixed(1)}</td><td><button class="secondary" onclick="studentCard('${s.id}')">كشف</button> <button class="danger" onclick="delStudent('${s.id}')">حذف</button></td></tr>`).join('')}</tbody></table>`:'<p class="small">لا يوجد طلاب.</p>'
}
function addStudent(){
 open(`<h2>إضافة طالب</h2><label>الصف</label>${classSelect('', 'modalClassSel')}<label>اسم الطالب</label><input id="sn"><div class="row" style="margin-top:12px"><button onclick="saveStudent()">حفظ</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function saveStudent(){const c=document.getElementById('modalClassSel'), n=document.getElementById('sn'); if(!c||!c.value||!n||!n.value.trim())return alert('اختر الصف واكتب الاسم'); db.students.push({id:id(),name:n.value.trim(),classId:c.value});save();closeM();students()}
function bulkStudents(){
 open(`<h2>إضافة عدة طلاب دفعة واحدة</h2><label>الصف</label>${classSelect('', 'modalClassSel')}<label>الأسماء — كل طالب في سطر</label><textarea id="bulk" rows="10" placeholder="أحمد محمد\nعلي حسن\nحسن عباس"></textarea><div class="row" style="margin-top:12px"><button onclick="saveBulk()">إضافة الطلاب</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function saveBulk(){const c=document.getElementById('modalClassSel'), b=document.getElementById('bulk'); let names=(b?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean); if(!c||!c.value||!names.length)return alert('اختر الصف واكتب الأسماء'); names.forEach(n=>db.students.push({id:id(),name:n,classId:c.value}));save();closeM();students()}
function delStudent(i){if(confirm('حذف الطالب وكل درجاته وحضوره؟')){db.students=db.students.filter(s=>s.id!==i);db.grades=db.grades.filter(g=>g.studentId!==i);db.attendance=db.attendance.filter(a=>a.studentId!==i);save();students()}}
function attendance(){
 let today=new Date().toISOString().slice(0,10);
 app.innerHTML=`<div class="card"><h2>الحضور اليومي</h2><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>التاريخ</label><input type="date" id="adate" value="${today}"></div></div><div id="attList"></div></div>`;
 classSel.onchange=drawAtt;adate.onchange=drawAtt;drawAtt()
}
function drawAtt(){
 let cid=classSel.value;if(!cid){attList.innerHTML='<p class="small">اختر الصف.</p>';return}
 let date=adate.value, arr=db.students.filter(s=>s.classId===cid);
 attList.innerHTML=`<div class="row" style="margin:10px 0"><button class="green" onclick="markAll('present')">تحضير الكل</button><button class="danger" onclick="markAll('absent')">غياب الكل</button><button class="orange" onclick="markAll('late')">تأخير الكل</button></div><table><thead><tr><th>الطالب</th><th>حاضر</th><th>متأخر</th><th>غائب</th></tr></thead><tbody>${arr.map(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===date);let st=a?.status||'';return `<tr><td>${esc(s.name)}</td><td><input type="radio" name="a_${s.id}" ${st==='present'?'checked':''} onchange="setAtt('${s.id}','present')"></td><td><input type="radio" name="a_${s.id}" ${st==='late'?'checked':''} onchange="setAtt('${s.id}','late')"></td><td><input type="radio" name="a_${s.id}" ${st==='absent'?'checked':''} onchange="setAtt('${s.id}','absent')"></td></tr>`}).join('')}</tbody></table>`
}
function setAtt(sid,status){let d=adate.value,a=db.attendance.find(x=>x.studentId===sid&&x.date===d);if(a)a.status=status;else db.attendance.push({id:id(),studentId:sid,date:d,status});save();drawAtt()}
function markAll(status){db.students.filter(s=>s.classId===classSel.value).forEach(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===adate.value);if(a)a.status=status;else db.attendance.push({id:id(),studentId:s.id,date:adate.value,status})});save();drawAtt()}
function grades(){
 app.innerHTML=`<div class="card"><h2>إدخال الدرجات</h2><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر</label><select id="month">${monthList().map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>نوع الدرجة</label><select id="gtype"><option value="participation">مشاركة</option><option value="oral">شفهي</option><option value="quiz">Quiz</option><option value="monthly">شهري</option></select></div></div><div id="gradeList"></div></div>`;
 classSel.onchange=drawGrades;month.onchange=drawGrades;gtype.onchange=drawGrades;drawGrades()
}
function drawGrades(){
 let cid=classSel.value;if(!cid){gradeList.innerHTML='<p class="small">اختر الصف.</p>';return}
 let typ=gtype.value, mon=month.value, arr=db.students.filter(s=>s.classId===cid);
 gradeList.innerHTML=`<table><thead><tr><th>الطالب</th><th>الدرجة /100</th><th>إجمالي النهائي</th></tr></thead><tbody>${arr.map(s=>{let vals=db.grades.filter(g=>g.studentId===s.id&&g.month===mon&&g.type===typ).map(g=>g.value);let v=vals.length?vals[vals.length-1]:'';return `<tr><td>${esc(s.name)}</td><td><input type="number" min="0" max="100" value="${v}" onchange="setGrade('${s.id}',this.value)"></td><td>${finalFor(s.id,mon).toFixed(1)}</td></tr>`}).join('')}</tbody></table><p class="small">الحضور يُحسب من سجل الحضور، والأنواع الأخرى من 100. الشهري وزنه 60%.</p>`
}
function setGrade(sid,v){v=+v;if(isNaN(v)||v<0||v>100)return alert('الدرجة يجب أن تكون من 0 إلى 100');db.grades.push({id:id(),studentId:sid,month:month.value,type:gtype.value,value:v,date:new Date().toISOString()});save();drawGrades()}
function reports(){
 app.innerHTML=`<div class="card"><h2>التقارير وكشف الدرجات</h2><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر</label><select id="rmonth">${monthList().map(m=>`<option>${m}</option>`).join('')}<option value="">كل الأشهر</option></select></div></div><div id="rep"></div></div>`;
 classSel.onchange=drawRep;rmonth.onchange=drawRep;drawRep()
}
function drawRep(){
 let cid=classSel.value;if(!cid){rep.innerHTML='<p class="small">اختر الصف.</p>';return}
 let mon=rmonth.value,arr=db.students.filter(s=>s.classId===cid).map(s=>({s,score:finalFor(s.id,mon)})).sort((a,b)=>b.score-a.score);
 rep.innerHTML=`<div class="row" style="margin:12px 0"><button onclick="exportCSV()">📥 تصدير CSV</button><button class="secondary" onclick="printReport()">🖨️ طباعة</button></div><table><thead><tr><th>الترتيب</th><th>الطالب</th><th>الحضور%</th><th>مشاركة</th><th>شفهي</th><th>Quiz</th><th>شهري</th><th>النهائي</th><th>الحالة</th></tr></thead><tbody>${arr.map((x,i)=>{let s=x.s;let avg=t=>{let a=db.grades.filter(g=>g.studentId===s.id&&(!mon||g.month===mon)&&g.type===t).map(g=>+g.value);return a.length?a.reduce((a,b)=>a+b,0)/a.length:0};return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${attendanceScore(s.id).toFixed(0)}</td><td>${avg('participation').toFixed(1)}</td><td>${avg('oral').toFixed(1)}</td><td>${avg('quiz').toFixed(1)}</td><td>${avg('monthly').toFixed(1)}</td><td class="${x.score<db.settings.pass?'bad':'good'}">${x.score.toFixed(1)}</td><td>${x.score<db.settings.pass?'يحتاج متابعة':'ناجح'}</td></tr>`}).join('')}</tbody></table><div class="card"><h3>ملخص</h3><p>عدد الطلاب: ${arr.length} — متوسط الصف: ${(arr.length?arr.reduce((a,b)=>a+b.score,0)/arr.length:0).toFixed(1)} — يحتاجون متابعة: ${arr.filter(x=>x.score<db.settings.pass).length}</p></div>`
}
function exportCSV(){
 let cid=classSel.value,mon=rmonth.value,arr=db.students.filter(s=>s.classId===cid).map(s=>({s,score:finalFor(s.id,mon)})).sort((a,b)=>b.score-a.score);
 let lines=[['الترتيب','الطالب','الحضور','المشاركة','الشفهي','Quiz','الشهري','النهائي','الحالة']];
 arr.forEach((x,i)=>{let avg=t=>{let a=db.grades.filter(g=>g.studentId===x.s.id&&(!mon||g.month===mon)&&g.type===t).map(g=>+g.value);return a.length?a.reduce((a,b)=>a+b,0)/a.length:0};lines.push([i+1,x.s.name,attendanceScore(x.s.id).toFixed(1),avg('participation').toFixed(1),avg('oral').toFixed(1),avg('quiz').toFixed(1),avg('monthly').toFixed(1),x.score.toFixed(1),x.score<db.settings.pass?'يحتاج متابعة':'ناجح'])});
 let csv='\ufeff'+lines.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='كشف_درجات.csv';a.click()
}
function printReport(){window.print()}
function studentCard(sid){
 let s=stu(sid);let rows=monthList().map(m=>`<tr><td>${m}</td><td>${finalFor(sid,m).toFixed(1)}</td></tr>`).join('');
 open(`<h2>كشف الطالب: ${esc(s.name)}</h2><p>الصف: ${esc(cls(s.classId)?.name||'')}</p><table><thead><tr><th>الشهر</th><th>النهائي</th></tr></thead><tbody>${rows}</tbody></table><h3>الحضور العام: ${attendanceScore(sid).toFixed(1)}%</h3><button onclick="closeM()">إغلاق</button>`)
}
function settings(){
 let w=db.settings.weights;
 app.innerHTML=`<div class="card"><h2>الإعدادات</h2><h3>أوزان الدرجات</h3><div class="grid">${[['attendance','الحضور'],['participation','المشاركة'],['oral','الشفهي'],['quiz','Quiz'],['monthly','الشهري']].map(([k,n])=>`<div><label>${n}%</label><input id="w_${k}" type="number" min="0" max="100" value="${w[k]}"></div>`).join('')}</div><label>درجة النجاح</label><input id="pass" type="number" min="0" max="100" value="${db.settings.pass}"><button style="margin-top:12px" onclick="saveSettings()">حفظ الإعدادات</button></div>
 <div class="card"><h3>النسخ الاحتياطي</h3><div class="row"><button onclick="backup()">⬇️ تصدير نسخة احتياطية</button><label class="btn secondary" style="text-align:center">⬆️ استعادة نسخة<input type="file" accept=".json" onchange="restore(this)" style="display:none"></label></div><p class="small">النسخة الاحتياطية تحفظ الصفوف والطلاب والحضور والدرجات والإعدادات.</p></div>
 <div class="card"><h3>إعادة ضبط</h3><button class="danger" onclick="resetAll()">حذف كل بيانات التطبيق</button></div>`
}
function saveSettings(){let keys=['attendance','participation','oral','quiz','monthly'];let vals=keys.map(k=>+document.getElementById('w_'+k).value);if(vals.reduce((a,b)=>a+b,0)!==100)return alert('مجموع النسب يجب أن يساوي 100%');keys.forEach(k=>db.settings.weights[k]=+document.getElementById('w_'+k).value);db.settings.pass=+pass.value;save();alert('تم حفظ الإعدادات');render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='نسخة_احتياطية_الأستاذ_عباس.json';a.click()}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.classes||!x.students)return alert('ملف غير صالح');db=x;save();alert('تمت الاستعادة');render()}catch(e){alert('تعذر قراءة الملف')}};r.readAsText(f)}
function resetAll(){if(confirm('تحذير: سيتم حذف كل البيانات نهائياً من هذا الهاتف. هل أنت متأكد؟')){localStorage.removeItem(KEY);location.reload()}}
function open(c){modalBox.innerHTML=c;modal.style.display='flex'}function closeM(){modal.style.display='none'}
render();
</script>
