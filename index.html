<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769c2">
<link rel="manifest" href="manifest.json">
<title>تطبيق الأستاذ عباس عناد</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#1769c2;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}header small{opacity:.9}
main{padding:14px;max-width:1100px;margin:auto;padding-bottom:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
nav button{flex:1;border:0;background:#fff;padding:10px 3px;font-size:12px;color:#333}
nav button b{display:block;font-size:20px;margin-bottom:2px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000010}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{font-size:13px;color:#697386}.stat strong{display:block;font-size:28px;color:#1769c2;margin-top:6px}
button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#1769c2;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#eaf2fc;color:#1769c2}.danger{background:#d92d20!important}.green{background:#198754}.orange{background:#d97706}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:10px;background:#fff;font-size:15px}
label{font-size:13px;color:#566274;display:block;margin:8px 0 5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e6eaf0;text-align:center}th{background:#f1f5f9}
.bad{color:#c62828;font-weight:bold}.good{color:#198754;font-weight:bold}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal .box{background:white;border-radius:18px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4fb;margin:2px;font-size:12px}
.hide{display:none}.small{font-size:12px;color:#6b7280}.wa{background:#25D366!important;color:#fff!important}.report-card{border:1px solid #e6eaf0}.title{display:flex;justify-content:space-between;align-items:center;gap:10px}.batch-progress{background:#eef4fb;border-radius:12px;padding:12px;margin-top:10px}.progress-bar{height:10px;background:#dbe5f0;border-radius:10px;overflow:hidden}.progress-bar i{display:block;height:100%;background:#1769c2;width:0}.queue-list{max-height:260px;overflow:auto;border:1px solid #e6eaf0;border-radius:10px;margin-top:10px}.queue-list div{padding:8px;border-bottom:1px solid #eef1f5}.queue-list div:last-child{border-bottom:0}
h2{font-size:19px}h3{font-size:16px}
@media(max-width:600px){table{font-size:11px}th,td{padding:6px}.desktop{display:none}}
</style>
</head>
<body>
<header><h1>📖 تطبيق الأستاذ عباس عناد</h1><small>إدارة الصفوف والحضور والدرجات — بدون كلمة مرور</small></header>
<main id="app"></main>
<nav>
<button onclick="go('home')"><b>🏠</b>الرئيسية</button>
<button onclick="go('classes')"><b>🎓</b>الصفوف</button>
<button onclick="go('students')"><b>👥</b>الطلاب</button>
<button onclick="go('attendance')"><b>📅</b>الحضور</button>
<button onclick="go('grades')"><b>📝</b>الدرجات</button>
<button onclick="go('reports')"><b>📊</b>التقارير</button>
<button onclick="go('settings')"><b>⚙️</b>الإعدادات</button>
</nav>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const KEY='abbas_teacher_v4';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{};
db.classes=Array.isArray(db.classes)?db.classes.filter(x=>x&&typeof x==='object'):[];
db.students=Array.isArray(db.students)?db.students.filter(x=>x&&typeof x==='object'):[];
db.attendance=Array.isArray(db.attendance)?db.attendance.filter(x=>x&&typeof x==='object'):[];
db.grades=Array.isArray(db.grades)?db.grades.filter(x=>x&&typeof x==='object'):[];
db.participation=Array.isArray(db.participation)?db.participation.filter(x=>x&&typeof x==='object'):[];
db.notes=Array.isArray(db.notes)?db.notes.filter(x=>x&&typeof x==='object'):[];
db.settings=db.settings&&typeof db.settings==='object'?db.settings:{};
db.settings.weights=Object.assign({attendance:10,participation:10,oral:10,quiz:10,monthly:60},db.settings.weights||{});
if(typeof db.settings.pass!=='number') db.settings.pass=50;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cls(id){return db.classes.find(x=>x&&x.id===id)}
function stu(id){return db.students.find(x=>x&&x.id===id)}
function monthList(){return ['الشهر الأول','الشهر الثاني','الشهر الثالث','الشهر الرابع','الشهر الخامس','الشهر السادس','الشهر السابع','الشهر الثامن','الشهر التاسع','الشهر العاشر']}
const MAX_SCORE={participation:100,oral:10,quiz:10,monthly:60};
function participationRecords(sid,month){
 let rows=db.participation.filter(x=>x&&x.studentId===sid);
 if(month){
  const mi=monthList().indexOf(month);
  rows=rows.filter(x=>x.month===month || (x.date && new Date(x.date+'T00:00:00').getMonth()===mi));
 }
 return rows;
}
function participationStats(sid,month){
 const rows=participationRecords(sid,month);
 const participated=rows.filter(x=>x&&x.status==='participated').length;
 const notParticipated=rows.filter(x=>x&&x.status==='notParticipated').length;
 const asked=participated+notParticipated;
 const notAsked=Math.max(0,rows.length-asked);
 return {participated,notParticipated,asked,notAsked,score:asked?participated/asked*100:0};
}
function participationDates(sid,month,status){
 return participationRecords(sid,month).filter(x=>x.status===status).map(x=>x.date).filter(Boolean).sort();
}
function participationPercent(sid,month){
 const st=participationStats(sid,month);
 return st.score;
}
function avgRaw(sid,type,month){let a=db.grades.filter(x=>x.studentId===sid&&x.type===type&&(!month||x.month===month)).map(x=>+x.value).filter(v=>!isNaN(v));return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function weightedScore(raw,max,weight){return max>0?Math.max(0,Math.min(raw,max))/max*weight:0}
function finalFor(sid,month){
 const w=db.settings&&db.settings.weights?db.settings.weights:{attendance:10,participation:10,oral:10,quiz:10,monthly:60};
 const attendance=weightedScore(attendanceScore(sid,month),100,w.attendance);
 const participation=weightedScore(participationPercent(sid,month),100,w.participation);
 const oral=weightedScore(avgRaw(sid,'oral',month),10,w.oral);
 const quiz=weightedScore(avgRaw(sid,'quiz',month),10,w.quiz);
 const monthly=weightedScore(avgRaw(sid,'monthly',month),60,w.monthly);
 return attendance+participation+oral+quiz+monthly;
}
function absenceDates(sid,month){
 let a=db.attendance.filter(x=>x.studentId===sid && x.status==='absent');
 if(month){
  const mi=monthList().indexOf(month)+1;
  if(mi>=1){a=a.filter(x=>{const d=new Date(x.date+'T00:00:00');return !isNaN(d)&&d.getMonth()+1===mi;});}
 }
 return a.map(x=>x.date).filter(Boolean).sort();
}
function formatDateArabic(date){
 const d=new Date(date+'T00:00:00');
 if(isNaN(d)) return date;
 const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 return `${days[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function attendanceScore(sid,month){
 let a=db.attendance.filter(x=>x&&x.studentId===sid);
 if(month){
  const mi=monthList().indexOf(month)+1;
  if(mi>=1){a=a.filter(x=>{const d=new Date(x.date+'T00:00:00');return !isNaN(d)&&d.getMonth()+1===mi;});}
 }
 if(!a.length)return 0;
 const present=a.filter(x=>x.status==='present'||x.status==='late').length;
 return present/a.length*100;
}
function classSelect(selected='', fieldId='classSel'){
 return `<select id="${fieldId}"><option value="">اختر الصف</option>${db.classes.filter(c=>c&&c.id).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name||'')} — ${esc(c.section||'')}</option>`).join('')}</select>`
}
function go(page){location.hash=page;render()}
window.onhashchange=render;
function render(){
 let p=location.hash.slice(1)||'home';
 try{
  if(p==='home')home();
  else if(p==='classes')classes();
  else if(p==='students')students();
  else if(p==='attendance')attendance();
  else if(p==='grades')grades();
  else if(p==='reports')reports();
  else settings();
 }catch(e){
  console.error('Render error:',e);
  app.innerHTML=`<div class="card" style="border:2px solid #c62828"><h2>حدث خطأ في عرض الصفحة</h2><p class="small">تم الاحتفاظ ببياناتك. اضغط «الإعدادات» أو أعد تحميل الصفحة.</p><details><summary>تفاصيل الخطأ</summary><pre style="white-space:pre-wrap">${esc(e?.message||e)}</pre></details></div>`;
 }
}
function safeFinalFor(sid,month){
 try{return Number(finalFor(sid,month))||0}catch(e){return 0}
}
function home(){
  const validStudents=db.students.filter(s=>s&&s.id);
  const avg=validStudents.length?validStudents.reduce((a,s)=>a+safeFinalFor(s.id,null),0)/validStudents.length:0;
  const today=new Date().toISOString().slice(0,10), present=db.attendance.filter(a=>a&&a.date===today&&a.status!=='absent').length;
  const previousMonth=previousMonthName();
  app.innerHTML=`<div class="card"><div class="title"><div><h2>الرئيسية</h2><div class="small">كل ما تحتاجه لإدارة طلابك في مكان واحد</div></div><button onclick="backup()">💾 نسخة احتياطية</button></div></div>
  <div class="grid">
  <div class="card stat">الصفوف<strong>${db.classes.length}</strong></div>
  <div class="card stat">الطلاب<strong>${db.students.length}</strong></div>
  <div class="card stat">حاضر اليوم<strong>${present}</strong></div>
  <div class="card stat">المعدل العام<strong>${avg.toFixed(1)}</strong></div>
  </div>

  <div class="card" style="border:2px solid #1769c2;background:#fff">
    <div class="title">
      <div>
        <h3 style="margin:0">📤 إرسال التقارير لأولياء الأمور</h3>
        <div class="small">إرسال تقارير ${previousMonth} لجميع الطلاب دفعة واحدة</div>
      </div>
      <span style="font-size:32px">📲</span>
    </div>
    <button class="wa" style="width:100%;font-size:18px;padding:16px;margin-top:12px" onclick="startBatchReports()">📤 إرسال جميع التقارير دفعة واحدة</button>
    ${batchQueue()?`<button class="orange" style="width:100%;margin-top:8px;font-size:16px" onclick="resumeBatch()">▶️ متابعة الإرسال المتبقي</button>`:''}
    <div class="small" style="margin-top:9px">يشمل التقرير: الحضور، عدد الغيابات، تواريخ الغياب، المشاركة، الشفهي، Quiz، الشهري والدرجة النهائية.</div>
    <div class="small" style="margin-top:5px">مهم: واتساب يفرض فتح المحادثة لكل طالب والضغط على إرسال؛ لا يمكن لصفحة ويب إرسال 150 رسالة تلقائيًا دون تفاعل المستخدم.</div>
  </div>

  <div class="card"><h3>الحساب المعتمد</h3><p>حضور <b>${db.settings.weights.attendance}%</b> + مشاركة <b>${db.settings.weights.participation}%</b> + شفهي <b>${db.settings.weights.oral}%</b> + Quiz <b>${db.settings.weights.quiz}%</b> + شهري <b>${db.settings.weights.monthly}%</b> = <b>100%</b></p></div>

  <div class="card"><h3>اختصارات</h3><div class="row">
    <button onclick="go('classes')">🎓 إدارة الصفوف</button>
    <button onclick="go('students')">👥 إدارة الطلاب</button>
    <button onclick="go('attendance')">📅 حضور اليوم</button>
    <button onclick="go('grades')">📝 إدخال الدرجات</button>
    <button onclick="go('reports')">📊 كشف وترتيب</button>
    <button class="wa" onclick="startBatchReports()">📤 إرسال كل التقارير</button>
  </div></div>`
}

function classes(){
 app.innerHTML=`<div class="card"><div class="title"><h2>الصفوف والشعب</h2><button onclick="addClass()">+ صف جديد</button></div>
 <div>${db.classes.length?db.classes.map(c=>`<div class="card"><div class="title"><div><b>${esc(c.name)}</b> <span class="pill">${esc(c.section||'بدون شعبة')}</span><div class="small">${db.students.filter(s=>s.classId===c.id).length} طالب</div></div><div><button class="secondary" onclick="editClass('${c.id}')">تعديل</button> <button class="danger" onclick="delClass('${c.id}')">حذف</button></div></div></div>`).join(''):'<p class="small">لا توجد صفوف بعد.</p>'}</div></div>`
}
function addClass(existing){
 open(`<h2>${existing?'تعديل الصف':'إضافة صف'}</h2><label>اسم الصف</label><input id="cn" value="${esc(existing?.name||'')}"><label>الشعبة</label><input id="cs" value="${esc(existing?.section||'')}"><div class="row" style="margin-top:12px"><button onclick="saveClass('${existing?.id||''}')">حفظ</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function saveClass(cid){let n=cn.value.trim();if(!n)return alert('اكتب اسم الصف');if(cid){let c=cls(cid);c.name=n;c.section=cs.value.trim()}else db.classes.push({id:id(),name:n,section:cs.value.trim()});save();closeM();classes()}
function editClass(i){addClass(cls(i))}
function delClass(i){if(confirm('حذف الصف؟ سيتم حذف طلابه ودرجاتهم وحضوره.')){db.students=db.students.filter(s=>s.classId!==i);db.classes=db.classes.filter(c=>c.id!==i);db.attendance=db.attendance.filter(a=>stu(a.studentId));db.grades=db.grades.filter(g=>stu(g.studentId));save();classes()}}
function students(){
 app.innerHTML=`<div class="card"><div class="title"><h2>الطلاب</h2><div class="row"><button onclick="addStudent()">+ طالب</button><button class="secondary" onclick="bulkStudents()">+ إضافة بالجملة</button></div></div>
 <label>تصفية حسب الصف</label>${classSelect()}<div id="studentList"></div></div>`;
 classSel.onchange=drawStudents;drawStudents()
}
function drawStudents(){
 let cid=classSel.value, arr=db.students.filter(s=>!cid||s.classId===cid);
 studentList.innerHTML=arr.length?`<table><thead><tr><th>#</th><th>الاسم</th><th>الصف</th><th>واتساب ولي الأمر</th><th>إجراء</th></tr></thead><tbody>${arr.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(cls(s.classId)?.name||'')}</td><td>${s.phone?`<span class="good">✓ ${esc(s.phone)}</span>`:'<span class="small">غير مضاف</span>'}</td><td><button class="secondary" onclick="studentCard('${s.id}')">كشف</button> ${s.phone?`<button class="wa" onclick="openWhatsApp('${s.id}')">واتساب</button>`:''} <button class="danger" onclick="delStudent('${s.id}')">حذف</button></td></tr>`).join('')}</tbody></table>`:'<p class="small">لا يوجد طلاب.</p>'
}
function addStudent(){
 open(`<h2>إضافة طالب</h2><label>الصف</label>${classSelect('', 'modalClassSel')}<label>اسم الطالب</label><input id="sn" placeholder="اسم الطالب الكامل"><label>رقم هاتف ولي الأمر — واتساب</label><input id="sphone" type="tel" inputmode="tel" placeholder="07701234567"><div class="small">اكتب الرقم مثل 07701234567 أو +9647xxxxxxxxx.</div><div class="row" style="margin-top:12px"><button onclick="saveStudent()">حفظ</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function normalizePhone(v){
 v=String(v||'').trim().replace(/[^0-9+]/g,'');
 if(v.startsWith('+'))v=v.slice(1);
 if(v.startsWith('00964'))v=v.slice(2);
 if(v.startsWith('0'))v='964'+v.slice(1);
 return v;
}
function saveStudent(){
 const c=document.getElementById('modalClassSel'), n=document.getElementById('sn'), p=document.getElementById('sphone');
 if(!c||!c.value||!n||!n.value.trim())return alert('اختر الصف واكتب الاسم');
 const phone=normalizePhone(p?.value||'');
 if(phone && !/^9647\d{9}$/.test(phone))return alert('رقم واتساب العراقي يجب أن يكون مثل 07701234567');
 db.students.push({id:id(),name:n.value.trim(),classId:c.value,phone});
 save();closeM();students()
}
function bulkStudents(){
 open(`<h2>إضافة عدة طلاب دفعة واحدة</h2><label>الصف</label>${classSelect('', 'modalClassSel')}<label>الأسماء — كل طالب في سطر</label><textarea id="bulk" rows="10" placeholder="أحمد محمد\nعلي حسن\nحسن عباس"></textarea><label>أرقام واتساب أولياء الأمور — اختياري، بنفس ترتيب الأسماء</label><textarea id="bulkPhones" rows="5" placeholder="07701234567\n07701234568\n07701234569"></textarea><div class="small">يمكن ترك الأرقام فارغة وإضافتها لاحقًا من كشف الطالب.</div><div class="row" style="margin-top:12px"><button onclick="saveBulk()">إضافة الطلاب</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function saveBulk(){
 const c=document.getElementById('modalClassSel'), b=document.getElementById('bulk'), bp=document.getElementById('bulkPhones');
 let names=(b?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
 let phones=(bp?.value||'').split(/\n/).map(x=>normalizePhone(x)).filter(Boolean);
 if(!c||!c.value||!names.length)return alert('اختر الصف واكتب الأسماء');
 if(phones.length && phones.length!==names.length)return alert('عدد أرقام واتساب يجب أن يساوي عدد الأسماء أو اترك الأرقام فارغة');
 names.forEach((n,i)=>db.students.push({id:id(),name:n,classId:c.value,phone:phones[i]||''}));
 save();closeM();students()
}
function delStudent(i){if(confirm('حذف الطالب وكل درجاته وحضوره؟')){db.students=db.students.filter(s=>s.id!==i);db.grades=db.grades.filter(g=>g.studentId!==i);db.attendance=db.attendance.filter(a=>a.studentId!==i);save();students()}}
function attendance(){
 let today=new Date().toISOString().slice(0,10);
 app.innerHTML=`<div class="card"><h2>الحضور اليومي</h2><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>التاريخ</label><input type="date" id="adate" value="${today}"></div></div><div id="attList"></div></div>`;
 classSel.onchange=drawAtt;adate.onchange=drawAtt;drawAtt()
}
function drawAtt(){
 let cid=classSel.value;if(!cid){attList.innerHTML='<p class="small">اختر الصف.</p>';return}
 let date=adate.value, arr=db.students.filter(s=>s&&s.classId===cid);
 attList.innerHTML=`<div class="row" style="margin:10px 0"><button class="green" onclick="markAll('present')">تحضير الكل</button><button class="danger" onclick="markAll('absent')">غياب الكل</button><button class="orange" onclick="markAll('late')">تأخير الكل</button></div><table><thead><tr><th>الطالب</th><th>حاضر</th><th>متأخر</th><th>غائب</th></tr></thead><tbody>${arr.map(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===date);let st=a?.status||'';return `<tr><td>${esc(s.name)}</td><td><input type="radio" name="a_${s.id}" ${st==='present'?'checked':''} onchange="setAtt('${s.id}','present')"></td><td><input type="radio" name="a_${s.id}" ${st==='late'?'checked':''} onchange="setAtt('${s.id}','late')"></td><td><input type="radio" name="a_${s.id}" ${st==='absent'?'checked':''} onchange="setAtt('${s.id}','absent')"></td></tr>`}).join('')}</tbody></table>`
}
function setAtt(sid,status){let d=adate.value,a=db.attendance.find(x=>x.studentId===sid&&x.date===d);if(a)a.status=status;else db.attendance.push({id:id(),studentId:sid,date:d,status});save();drawAtt()}
function markAll(status){db.students.filter(s=>s&&s.classId===classSel.value).forEach(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===adate.value);if(a)a.status=status;else db.attendance.push({id:id(),studentId:s.id,date:adate.value,status})});save();drawAtt()}
function grades(){
 app.innerHTML=`<div class="card"><h2>إدخال الدرجات</h2><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر</label><select id="month">${monthList().map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>نوع الدرجة</label><select id="gtype"><option value="participation">مشاركة</option><option value="oral">شفهي (من 10)</option><option value="quiz">Quiz (من 10)</option><option value="monthly">شهري (من 60)</option></select></div></div><div id="gradeList"></div></div>`;

function setParticipation(sid,status,date){
 db.participation=db.participation||[];
 const mon=month.value;
 let r=db.participation.find(x=>x.studentId===sid&&x.date===date);
 if(r){
  r.status=status;
  r.month=mon;
 }else{
  db.participation.push({id:id(),studentId:sid,date,month:mon,status});
 }
 save();drawGrades();
}
function markParticipationAll(status){

 const absenceText=absentDates.length?absentDates.map((d,i)=>`${i+1}. ${formatDateArabic(d)}`).join('\n'):'لا توجد أيام غياب مسجلة في هذا الشهر.';
  const pInfo=participationReportText(sid,month);
 return `📊 التقرير الشهري للطالب

👨‍🎓 الطالب: ${s.name}
🏫 الصف: ${clsName}

📌 الدرجات

📅 الحضور: ${attendance.toFixed(2)} / ${db.settings.weights.attendance}

${absenceText}

}
function batchQueue(){try{return JSON.parse(localStorage.getItem('abbas_batch_queue')||'null')}catch(e){return null}}
function saveBatch(q){localStorage.setItem('abbas_batch_queue',JSON.stringify(q))}
function clearBatch(){localStorage.removeItem('abbas_batch_queue')}
function waLinkFor(sid,month){
 const s=stu(sid); if(!s||!s.phone)return '';
 return 'https://wa.me/'+normalizePhone(s.phone)+'?text='+encodeURIComponent(reportMessageFor(sid,month));
}
function startBatchReports(){
 const eligible=db.students.filter(s=>s.phone);
 const missing=db.students.filter(s=>!s.phone);
 const defaultMonth=previousMonthName();
 open(`<h2>📤 إرسال التقارير دفعة واحدة</h2>
 <label>الشهر</label><select id="batchMonth">${monthList().map(m=>`<option value="${m}" ${m===defaultMonth?'selected':''}>${m}</option>`).join('')}</select>
 <div class="card"><b>سيتم تجهيز ${eligible.length} تقريرًا</b><br><span class="small">طلاب بدون رقم واتساب: ${missing.length}</span></div>
 <div class="small">سيتم فتح تقارير الطلاب بالتتابع. بعد العودة من واتساب اضغط «فتح التالي». واتساب لا يسمح لصفحة ويب بإرسال 150 رسالة تلقائيًا دون تأكيد المستخدم.</div>
 <div class="row" style="margin-top:12px"><button onclick="confirmBatchStart()">🚀 بدء الإرسال</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)
}
function confirmBatchStart(){
 const month=document.getElementById('batchMonth').value;
 const students=db.students.filter(s=>s.phone).map(s=>s.id);
 if(!students.length)return alert('لا يوجد طلاب لديهم أرقام واتساب.');
 saveBatch({month,index:0,students,startedAt:new Date().toISOString()});
 closeM(); showBatchProgress(); openNextBatch();
}
function showBatchProgress(){
 const q=batchQueue();
 if(!q||!q.students.length)return;
 const done=Math.min(q.index,q.students.length), total=q.students.length, current=done<total?stu(q.students[done]):null;
 open(`<h2>📤 إرسال التقارير</h2><div class="batch-progress"><b>التقدم: ${done} من ${total}</b><div class="progress-bar"><i style="width:${(done/total*100).toFixed(1)}%"></i></div><p>الشهر: <b>${esc(q.month)}</b></p>
<p>تم تجهيز <b>${done}</b> من أصل <b>${total}</b> تقريرًا.</p>
${current?`<p>التالي: <b>${esc(current.name)}</b></p>`:'<p class="good">✅ اكتملت جميع التقارير.</p>'}</div><div class="row">${current?`<button class="wa" onclick="openNextBatch()">📲 فتح التقرير التالي</button>`:''}<button class="secondary" onclick="closeM()">إغلاق</button>${current?`<button class="danger" onclick="cancelBatch()">إلغاء الدفعة</button>`:''}</div>`)
}
function openNextBatch(){
 const q=batchQueue(); if(!q)return;
 if(q.index>=q.students.length){clearBatch();alert('✅ اكتملت جميع التقارير.');return;}
 const sid=q.students[q.index], url=waLinkFor(sid,q.month);
 if(!url){q.index++;saveBatch(q);return openNextBatch();}
 q.index++;saveBatch(q);
 window.location.href=url;
}
function resumeBatch(){const q=batchQueue();if(!q)return;showBatchProgress()}
function cancelBatch(){if(confirm('إلغاء إرسال التقارير المتبقية؟')){clearBatch();closeM()}}

function settings(){
 let w=db.settings.weights;
 app.innerHTML=`<div class="card"><h2>الإعدادات</h2><h3>أوزان الدرجات</h3><div class="grid">${[['attendance','الحضور'],['participation','المشاركة'],['oral','الشفهي'],['quiz','Quiz'],['monthly','الشهري']].map(([k,n])=>`<div><label>${n}%</label><input id="w_${k}" type="number" min="0" max="100" value="${w[k]}"></div>`).join('')}</div><label>درجة النجاح</label><input id="pass" type="number" min="0" max="100" value="${db.settings.pass}"><button style="margin-top:12px" onclick="saveSettings()">حفظ الإعدادات</button></div>
 <div class="card"><h3>النسخ الاحتياطي</h3><div class="row"><button onclick="backup()">⬇️ تصدير نسخة احتياطية</button><label class="btn secondary" style="text-align:center">⬆️ استعادة نسخة<input type="file" accept=".json" onchange="restore(this)" style="display:none"></label></div><p class="small">النسخة الاحتياطية تحفظ الصفوف والطلاب والحضور والدرجات والمشاركة اليومية والملاحظات والإعدادات.</p></div>
 <div class="card"><h3>إعادة ضبط</h3><button class="danger" onclick="resetAll()">حذف كل بيانات التطبيق</button></div>`
}
function saveSettings(){let keys=['attendance','participation','oral','quiz','monthly'];let vals=keys.map(k=>+document.getElementById('w_'+k).value);if(vals.reduce((a,b)=>a+b,0)!==100)return alert('مجموع النسب يجب أن يساوي 100%');keys.forEach(k=>db.settings.weights[k]=+document.getElementById('w_'+k).value);db.settings.pass=+pass.value;save();alert('تم حفظ الإعدادات');render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='نسخة_احتياطية_الأستاذ_عباس.json';a.click()}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.classes||!x.students)return alert('ملف غير صالح');db=x;save();alert('تمت الاستعادة');render()}catch(e){alert('تعذر قراءة الملف')}};r.readAsText(f)}
function resetAll(){if(confirm('تحذير: سيتم حذف كل البيانات نهائياً من هذا الهاتف. هل أنت متأكد؟')){localStorage.removeItem(KEY);location.reload()}}
function open(c){modalBox.innerHTML=c;modal.style.display='flex'}function closeM(){modal.style.display='none'}
render();
</script>
