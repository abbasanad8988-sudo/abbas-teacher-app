:root{--blue:#0757c9;--blue2:#0b73e8;--navy:#071a4a;--bg:#f4f7fc;--card:#fff;--text:#172033;--muted:#718096;--line:#e5eaf2;--green:#16a05d;--red:#e53935;--orange:#f59e0b;--purple:#7357e8;--shadow:0 10px 30px rgba(25,55,100,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}body{min-height:100vh;padding-bottom:92px}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app-shell{max-width:900px;margin:auto}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),#0645a3);color:#fff;padding:16px 18px 22px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(7,87,201,.2)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#0b73e8,#062e86);display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff55,0 8px 20px #001f5a55;overflow:hidden}.logo svg{width:44px;height:44px}.brand h1{font-size:18px;margin:0 0 4px;font-weight:900}.brand small{opacity:.82;font-size:11px}.iconbtn{width:42px;height:42px;border-radius:14px;background:#ffffff1c;color:#fff;font-size:20px}.page{padding:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:4px 0 18px}.hero h2{margin:0;font-size:24px}.hero p{margin:6px 0 0;color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid #edf1f7;border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;border-radius:18px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--line);min-height:108px;position:relative;overflow:hidden}.stat .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:10px}.stat strong{display:block;font-size:25px;line-height:1}.stat span{font-size:12px;color:var(--muted);display:block;margin-top:7px}.blue{background:#eaf3ff;color:var(--blue)}.greenbg{background:#e9f8f0;color:var(--green)}.redbg{background:#fff0ef;color:var(--red)}.purplebg{background:#f1edff;color:var(--purple)}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;min-height:104px;box-shadow:0 6px 18px #163f7710}.quick b{display:block;font-size:24px;margin-bottom:7px}.quick span{font-size:13px;font-weight:800}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:15px;padding:12px 16px;font-weight:800}.secondary{background:#edf4ff;color:var(--blue);border-radius:15px;padding:11px 14px;font-weight:800}.danger{background:#ffeceb;color:#d32f2f;border-radius:15px;padding:11px 14px;font-weight:800}.success{background:#e9f8f0;color:#087a43;border-radius:15px;padding:11px 14px;font-weight:800}.warning{background:#fff5df;color:#a76700;border-radius:15px;padding:11px 14px;font-weight:800}.wa{background:#22c967;color:#fff;border-radius:15px;padding:11px 14px;font-weight:800}.wide{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-title h3{margin:0;font-size:17px}.small{font-size:12px;color:var(--muted)}label{font-size:12px;color:#5e6a7d;display:block;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #d9e1ec;background:#fff;border-radius:14px;padding:12px 13px;outline:none;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:#7db0f7;box-shadow:0 0 0 3px #0b73e817}.search{position:relative}.search input{padding-right:42px}.search .sicon{position:absolute;right:14px;top:11px;color:#7b8798}.list{display:flex;flex-direction:column;gap:10px}.student{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#dcecff,#b8d5ff);display:grid;place-items:center;font-size:22px;flex:none}.student-main{min-width:0;flex:1}.student-main b{display:block;font-size:14px}.student-main small{display:block;color:var(--muted);margin-top:4px}.student-score{font-weight:900;font-size:16px;text-align:left}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.badge.good{background:#e8f8ef;color:#0b7a43}.badge.bad{background:#fff0ef;color:#c62828}.badge.warn{background:#fff5df;color:#9b6500}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;border-radius:11px;font-size:11px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 25px #102f5712;padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:900px;margin:auto}.navitem{background:transparent;color:#7a8495;padding:6px 3px;border-radius:13px;font-size:10px;font-weight:800}.navitem b{display:block;font-size:21px;line-height:24px;margin-bottom:2px}.navitem.active{color:var(--blue);background:#edf4ff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:640px;background:#fff}th,td{padding:11px 8px;border-bottom:1px solid #edf1f5;text-align:center;font-size:12px}th{background:#f7f9fd;color:#556174;position:sticky;top:0}tr:last-child td{border-bottom:0}.score-big{font-size:34px;font-weight:900;color:var(--blue)}.formula{background:#f7faff;border:1px dashed #9fc3f5;border-radius:16px;padding:13px;line-height:1.8}.participation-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:17px;padding:11px;background:#fff}.pbuttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pbuttons button{font-size:11px;padding:10px 5px;border-radius:12px;background:#f2f5f9;color:#536071}.pbuttons .sel-green{background:#dff7e9;color:#087a43}.pbuttons .sel-red{background:#ffe6e4;color:#c62828}.pbuttons .sel-gray{background:#eaf0f7;color:#516070}.date-chip{display:inline-flex;background:#f0f5fb;border-radius:10px;padding:5px 8px;font-size:11px;margin:2px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.modal{position:fixed;inset:0;background:#071a4a88;display:none;align-items:flex-end;justify-content:center;z-index:60;padding:0}.modal.show{display:flex}.modalbox{background:#fff;width:100%;max-width:760px;border-radius:28px 28px 0 0;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 -15px 45px #001b5030}.handle{width:42px;height:4px;background:#d5dce7;border-radius:99px;margin:0 auto 14px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal-head h2{margin:0;font-size:19px}.close{background:#eef3f8;color:#566274;width:38px;height:38px;border-radius:12px}.progress{height:9px;background:#e9eef6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#43a3ff);border-radius:99px}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:90;background:#172033;color:#fff;padding:11px 15px;border-radius:14px;box-shadow:var(--shadow);font-size:12px;display:none}.toast.show{display:block}.desktop-only{display:block}@media(min-width:720px){body{padding-bottom:0}.bottomnav{position:sticky;top:0;margin:12px auto 0;border:1px solid var(--line);border-radius:18px;bottom:auto}.modal{align-items:center;padding:18px}.modalbox{border-radius:24px;max-height:85vh}.stats{grid-template-columns:repeat(4,1fr)}.quick-grid{grid-template-columns:repeat(4,1fr)}.page{padding:24px}.topbar{border-radius:0 0 32px 32px}.student{padding:14px}.participation-row{grid-template-columns:1fr 330px}}
@media(max-width:430px){.hero h2{font-size:21px}.brand h1{font-size:16px}.student-score{font-size:14px}.actions button{font-size:10px;padding:7px}.desktop-only{display:none}}
@media print{.topbar,.bottomnav,.no-print{display:none!important}body{padding:0;background:#fff}.page{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>

<body>
<div id="toast" class="toast"></div>
<div class="app-shell">
<header class="topbar">
  <div class="toprow">
    <div class="brand">
      <div class="logo" aria-label="شعار الأستاذ عباس عناد">
        <svg viewBox="0 0 64 64" fill="none"><path d="M9 26 32 11l23 15-23 15L9 26Z" fill="#fff" opacity=".96"/><path d="M19 31v17c7 4 19 4 26 0V31L32 39 19 31Z" fill="#eaf3ff"/><path d="M32 17c-8 0-14 5-14 12 0 6 6 10 14 10s14-4 14-10c0-7-6-12-14-12Z" fill="#0b55bd"/><path d="m21 31 7-9 4 5 7-10 4 14H21Z" fill="#fff"/><path d="M14 52h36" stroke="#f6c453" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <div><h1>الأستاذ عباس عناد</h1><small>مدرس مادة اللغة الإنجليزية</small></div>

    <button class="iconbtn" onclick="go('settings')" title="الإعدادات">⚙️</button>

</header>
<main id="app" class="page"></main>
<nav class="bottomnav">
  <button class="navitem" data-page="home" onclick="go('home')"><b>⌂</b>الرئيسية</button>
  <button class="navitem" data-page="students" onclick="go('students')"><b>👥</b>الطلاب</button>
  <button class="navitem" data-page="attendance" onclick="go('attendance')"><b>✓</b>الحضور</button>
  <button class="navitem" data-page="grades" onclick="go('grades')"><b>▣</b>الدرجات</button>

<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="modalBox" class="modalbox"><div class="handle"></div></div></div>
<script>
const KEY='abbas_teacher_v4';
const DEFAULT_DB={classes:[],students:[],attendance:[],grades:[],settings:{weights:{attendance:10,participation:10,oral:10,quiz:10,monthly:60},pass:50},participation:[],participationLog:[]};
let db=loadDB();
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){x.settings=x.settings||{};x.settings.weights=Object.assign({},DEFAULT_DB.settings.weights,x.settings.weights||{});x.settings.pass=x.settings.pass??50;x.classes=x.classes||[];x.students=x.students||[];x.attendance=x.attendance||[];x.grades=x.grades||[];x.participation=x.participation||[];x.participationLog=x.participationLog||[];return x}}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_DB))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cls(i){return db.classes.find(x=>x.id===i)}
function stu(i){return db.students.find(x=>x.id===i)}
function monthList(){return ['الشهر الأول','الشهر الثاني','الشهر الثالث','الشهر الرابع','الشهر الخامس','الشهر السادس','الشهر السابع','الشهر الثامن','الشهر التاسع','الشهر العاشر']}
const MAX_SCORE={oral:10,quiz:10,monthly:60};
function currentDate(){return new Date().toISOString().slice(0,10)}
function formatDateArabic(date){const d=new Date(date+'T00:00:00');if(isNaN(d))return date;const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];return `${days[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='964'+p.slice(1);if(!p.startsWith('964')&&p.length===10)p='964'+p;return p}
function monthIndex(month){const i=monthList().indexOf(month);return i<0?null:i+1}
function inMonth(date,month){if(!month)return true;const d=new Date(date+'T00:00:00');const mi=monthIndex(month);return !isNaN(d)&&mi?d.getMonth()+1===mi:true}
function attendanceRows(sid,month){return db.attendance.filter(a=>a.studentId===sid&&(!month||(a.month?a.month===month:inMonth(a.date,month))))}
function attendanceScore(sid,month){const rows=attendanceRows(sid,month);if(!rows.length)return 0;const present=rows.filter(a=>a.status==='present'||a.status==='late').length;return present/rows.length*100}
function absenceDates(sid,month){return attendanceRows(sid,month).filter(a=>a.status==='absent').map(a=>a.date).sort()}
function participationLogFor(sid,month){return (db.participationLog||[]).filter(x=>x.studentId===sid&&(!month||x.month===month)&&['participated','notParticipated'].includes(x.status))}
function participationSummary(sid,month){const rows=participationLogFor(sid,month);const participated=rows.filter(x=>x.status==='participated').length;const notParticipated=rows.filter(x=>x.status==='notParticipated').length;const asked=participated+notParticipated;return {rows,participated,notParticipated,asked,pct:asked?participated/asked*100:0,score:asked?participated/asked*10:0}}
function participationPercent(sid,month){const s=participationSummary(sid,month);if(s.asked)return s.pct;const legacy=(db.participation||[]).filter(x=>x.studentId===sid&&inMonth(x.date,month));if(legacy.length){const p=legacy.reduce((n,x)=>n+(+x.participated||0),0),t=legacy.reduce((n,x)=>n+(+x.participated||0)+(+x.notParticipated||0),0);return t?p/t*100:0}const g=db.grades.filter(x=>x.studentId===sid&&x.type==='participation'&&(!month||x.month===month)).map(x=>+x.value).filter(Number.isFinite);return g.length?g.reduce((a,b)=>a+b,0)/g.length:0}
function avgRaw(sid,type,month){const a=db.grades.filter(x=>x.studentId===sid&&x.type===type&&(!month||x.month===month)).map(x=>+x.value).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function weightedScore(raw,max,weight){return max?Math.max(0,Math.min(raw,max))/max*weight:0}
function finalFor(sid,month){const w=db.settings.weights;return weightedScore(attendanceScore(sid,month),100,w.attendance)+weightedScore(participationPercent(sid,month),100,w.participation)+weightedScore(avgRaw(sid,'oral',month),10,w.oral)+weightedScore(avgRaw(sid,'quiz',month),10,w.quiz)+weightedScore(avgRaw(sid,'monthly',month),60,w.monthly)}
function statusFor(score){return score<db.settings.pass?'يحتاج متابعة':'ناجح'}
function classSelect(selected='',fieldId='classSel'){return `<select id="${fieldId}"><option value="">اختر الصف</option>${db.classes.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}${c.section?' — '+esc(c.section):''}</option>`).join('')}</select>`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function open(html){document.getElementById('modalBox').innerHTML='<div class="handle"></div>'+html;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function go(page){location.hash=page;render()}
window.addEventListener('hashchange',render);
function render(){const p=location.hash.slice(1)||'home';if(p==='home')home();else if(p==='students')students();else if(p==='attendance')attendance();else if(p==='grades')grades();else if(p==='reports')reports();else if(p==='classes')classes();else settings();updateNav(p)}
function updateNav(p){document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===p));}
function moreMenu(){open(`<div class="modal-head"><h2>المزيد</h2><button class="close" onclick="closeM()">✕</button></div><div class="quick-grid"><button class="quick" onclick="closeM();go('classes')"><b>🎓</b><span>الصفوف والشعب</span></button><button class="quick" onclick="closeM();go('reports')"><b>📊</b><span>التقارير والكشف</span></button><button class="quick" onclick="closeM();startBatchReports()"><b>📤</b><span>إرسال التقارير</span></button><button class="quick" onclick="closeM();go('settings')"><b>⚙️</b><span>الإعدادات</span></button></div>`)}
function home(){const today=currentDate();const todayRows=db.attendance.filter(a=>a.date===today);const present=todayRows.filter(a=>a.status==='present'||a.status==='late').length;const absent=todayRows.filter(a=>a.status==='absent').length;const avg=db.students.length?db.students.reduce((a,s)=>a+finalFor(s.id,null),0)/db.students.length:0;const prev=previousMonthName();const due= new Date().getDate()===1;app.innerHTML=`<div class="hero"><div><h2>صباح الخير أستاذ عباس 👋</h2><p>لوحة التحكم — ${esc(prev)}</p></div><button class="secondary" onclick="backup()">💾 نسخة احتياطية</button></div><div class="stats"><div class="stat"><div class="ico blue">👥</div><strong>${db.students.length}</strong><span>إجمالي الطلاب</span></div><div class="stat"><div class="ico greenbg">✓</div><strong>${present}</strong><span>حاضر اليوم</span></div><div class="stat"><div class="ico redbg">●</div><strong>${absent}</strong><span>غائب اليوم</span></div><div class="stat"><div class="ico purplebg">▥</div><strong>${avg.toFixed(1)}</strong><span>المعدل العام</span></div></div>${due?`<div class="card" style="border:1px solid #b9d4ff;background:#f4f9ff"><div class="section-title"><h3>📤 حان وقت تقارير الشهر السابق</h3><span class="badge warn">اليوم 1</span></div><p class="small">يمكنك تجهيز التقارير دفعة واحدة. سيحتاج فتح واتساب وإرسال كل رسالة إلى تأكيد المستخدم بسبب قيود المتصفح وواتساب.</p><button class="primary wide" onclick="startBatchReports()">إرسال التقارير دفعة واحدة</button></div>`:''}<div class="card"><div class="section-title"><h3>إجراءات سريعة</h3><span class="small">كل شيء بنقرة</span></div><div class="quick-grid"><button class="quick" onclick="go('attendance')"><b>📅</b><span>حضور اليوم</span></button><button class="quick" onclick="go('grades')"><b>🗣️</b><span>تسجيل المشاركة</span></button><button class="quick" onclick="go('grades')"><b>📝</b><span>إدخال الدرجات</span></button><button class="quick" onclick="startBatchReports()"><b>📤</b><span>إرسال التقارير</span></button></div></div><div class="card"><div class="section-title"><h3>الحساب المعتمد</h3><span class="badge good">100%</span></div><div class="formula">الحضور <b>${db.settings.weights.attendance}%</b> + المشاركة <b>${db.settings.weights.participation}%</b> + الشفهي <b>${db.settings.weights.oral}%</b> + Quiz <b>${db.settings.weights.quiz}%</b> + الشهري <b>${db.settings.weights.monthly}%</b><br><b>المشاركة:</b> عدد مرات المشاركة ÷ عدد مرات السؤال × 10. «لم يتم سؤاله» لا يدخل في الحساب.</div></div><div class="card"><div class="section-title"><h3>تنبيهات مهمة</h3><span class="small">متابعة</span></div>${alertsHTML()}</div>`}
function alertsHTML(){const low=db.students.filter(s=>finalFor(s.id,null)<db.settings.pass).length;const noPhone=db.students.filter(s=>!s.phone).length;const absentHeavy=db.students.filter(s=>db.attendance.filter(a=>a.studentId===s.id&&a.status==='absent').length>=3).length;return `<div class="list"><div class="student"><div class="avatar">⚠️</div><div class="student-main"><b>${low} طالب يحتاج متابعة</b><small>حسب الدرجة النهائية الحالية</small></div></div><div class="student"><div class="avatar">📱</div><div class="student-main"><b>${noPhone} طالب بدون رقم ولي أمر</b><small>أضف الرقم لإرسال التقرير عبر واتساب</small></div></div><div class="student"><div class="avatar">🚫</div><div class="student-main"><b>${absentHeavy} طلاب لديهم غياب متكرر</b><small>ثلاثة أيام غياب أو أكثر</small></div></div></div>`}
function classes(){app.innerHTML=`<div class="hero"><div><h2>الصفوف والشعب</h2><p>إدارة الصفوف وعدد الطلاب</p></div><button class="primary" onclick="addClass()">+ صف جديد</button></div><div class="list">${db.classes.length?db.classes.map(c=>`<div class="card"><div class="section-title"><div><h3>${esc(c.name)}</h3><span class="badge blue">${esc(c.section||'بدون شعبة')}</span><div class="small" style="margin-top:6px">${db.students.filter(s=>s.classId===c.id).length} طالب</div></div><div class="actions"><button class="secondary" onclick="editClass('${c.id}')">تعديل</button><button class="danger" onclick="delClass('${c.id}')">حذف</button></div></div></div>`).join(''):`<div class="card empty">لا توجد صفوف. ابدأ بإضافة أول صف.</div>`}</div>`}
function addClass(existing){open(`<div class="modal-head"><h2>${existing?'تعديل الصف':'إضافة صف'}</h2><button class="close" onclick="closeM()">✕</button></div><label>اسم الصف</label><input id="cn" value="${esc(existing?.name||'')}"><label>الشعبة</label><input id="cs" value="${esc(existing?.section||'')}"><div class="row" style="margin-top:15px"><button class="primary" onclick="saveClass('${existing?.id||''}')">حفظ</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)}
function saveClass(cid){const n=document.getElementById('cn').value.trim();if(!n)return alert('اكتب اسم الصف');if(cid){const c=cls(cid);c.name=n;c.section=document.getElementById('cs').value.trim()}else db.classes.push({id:id(),name:n,section:document.getElementById('cs').value.trim()});save();closeM();classes();showToast('تم حفظ الصف')}
function editClass(i){addClass(cls(i))}
function delClass(i){if(confirm('حذف الصف؟ سيتم حذف طلابه ودرجاته وحضوره.')){const ids=db.students.filter(s=>s.classId===i).map(s=>s.id);db.students=db.students.filter(s=>s.classId!==i);db.classes=db.classes.filter(c=>c.id!==i);db.attendance=db.attendance.filter(a=>!ids.includes(a.studentId));db.grades=db.grades.filter(g=>!ids.includes(g.studentId));db.participationLog=db.participationLog.filter(p=>!ids.includes(p.studentId));save();classes();showToast('تم حذف الصف')}}
function students(){app.innerHTML=`<div class="hero"><div><h2>الطلاب</h2><p>${db.students.length} طالب مسجل</p></div><div class="actions"><button class="primary" onclick="addStudent()">+ طالب</button><button class="secondary" onclick="bulkStudents()">إضافة بالجملة</button></div></div><div class="card"><div class="row"><div class="search"><span class="sicon">⌕</span><input id="studentSearch" placeholder="ابحث عن طالب..."></div><div>${classSelect()}</div></div></div><div id="studentList"></div>`;document.getElementById('classSel').onchange=drawStudents;document.getElementById('studentSearch').oninput=drawStudents;drawStudents()}
function drawStudents(){const cid=document.getElementById('classSel')?.value||'';const q=(document.getElementById('studentSearch')?.value||'').trim().toLowerCase();const arr=db.students.filter(s=>(!cid||s.classId===cid)&&(!q||s.name.toLowerCase().includes(q)));const list=document.getElementById('studentList');if(!arr.length){list.innerHTML='<div class="card empty">لا يوجد طلاب مطابقون.</div>';return}list.innerHTML='<div class="list">'+arr.map(s=>{const score=finalFor(s.id,null),st=statusFor(score);return `<div class="student"><div class="avatar">👨‍🎓</div><div class="student-main"><b>${esc(s.name)}</b><small>${esc(cls(s.classId)?.name||'')} ${s.phone?'• 📱 '+esc(s.phone):'• بدون رقم واتساب'}</small><span class="badge ${score<db.settings.pass?'warn':'good'}">${st}</span></div><div class="student-score">${score.toFixed(1)}<small style="display:block;color:#8a95a5;font-size:9px">/100</small></div><div class="actions"><button class="secondary" onclick="studentCard('${s.id}')">كشف</button>${s.phone?'<button class="wa" onclick="openWhatsApp(\''+s.id+'\')">واتساب</button>':''}<button class="danger" onclick="delStudent(\''+s.id+'\')">حذف</button></div></div>`}).join('')+'</div>'}
function addStudent(){open(`<div class="modal-head"><h2>إضافة طالب</h2><button class="close" onclick="closeM()">✕</button></div><label>الصف</label>${classSelect('','modalClassSel')}<label>اسم الطالب</label><input id="sn" placeholder="اسم الطالب الكامل"><label>رقم هاتف ولي الأمر — واتساب</label><input id="sphone" inputmode="tel" placeholder="07701234567"><p class="small">يُحفظ تلقائياً بصيغة واتساب الدولية.</p><div class="row" style="margin-top:14px"><button class="primary" onclick="saveStudent()">حفظ الطالب</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)}
function saveStudent(){const c=document.getElementById('modalClassSel'),n=document.getElementById('sn'),p=document.getElementById('sphone');const phone=normalizePhone(p.value);if(!c.value||!n.value.trim())return alert('اختر الصف واكتب الاسم');if(phone&&!/^9647\d{9}$/.test(phone))return alert('رقم واتساب العراقي غير صحيح');db.students.push({id:id(),name:n.value.trim(),classId:c.value,phone});save();closeM();students();showToast('تمت إضافة الطالب')}
function bulkStudents(){open(`<div class="modal-head"><h2>إضافة طلاب بالجملة</h2><button class="close" onclick="closeM()">✕</button></div><label>الصف</label>${classSelect('','modalClassSel')}<label>أسماء الطلاب — كل اسم في سطر</label><textarea id="bulk" rows="8" placeholder="أحمد محمد\nعلي حسن\nحسن عباس"></textarea><label>أرقام واتساب — بنفس ترتيب الأسماء، اختياري</label><textarea id="bulkPhones" rows="5" placeholder="07701234567\n07701234568"></textarea><div class="row" style="margin-top:14px"><button class="primary" onclick="saveBulk()">إضافة الجميع</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)}
function saveBulk(){const c=document.getElementById('modalClassSel');const names=document.getElementById('bulk').value.split(/\n/).map(x=>x.trim()).filter(Boolean);const phones=document.getElementById('bulkPhones').value.split(/\n/).map(normalizePhone).filter(Boolean);if(!c.value||!names.length)return alert('اختر الصف واكتب الأسماء');if(phones.length&&phones.length!==names.length)return alert('عدد الأرقام يجب أن يساوي عدد الأسماء أو اتركه فارغاً');names.forEach((n,i)=>db.students.push({id:id(),name:n,classId:c.value,phone:phones[i]||''}));save();closeM();students();showToast(`تمت إضافة ${names.length} طالب`)}
function delStudent(sid){if(confirm('حذف الطالب وكل درجاته وحضوره وسجل مشاركته؟')){db.students=db.students.filter(s=>s.id!==sid);db.grades=db.grades.filter(g=>g.studentId!==sid);db.attendance=db.attendance.filter(a=>a.studentId!==sid);db.participationLog=db.participationLog.filter(p=>p.studentId!==sid);save();students();showToast('تم حذف الطالب')}}
function attendance(){const today=currentDate();app.innerHTML=`<div class="hero"><div><h2>تسجيل الحضور</h2><p>حاضر • متأخر • غائب</p></div><button class="primary" onclick="go('reports')">كشف النتائج</button></div><div class="card"><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر الدراسي</label><select id="amonth">${monthList().map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>التاريخ</label><input type="date" id="adate" value="${today}"></div></div><div id="attList" style="margin-top:12px"></div></div>`;document.getElementById('classSel').onchange=drawAtt;document.getElementById('adate').onchange=drawAtt;document.getElementById('amonth').onchange=drawAtt;drawAtt()}
function drawAtt(){const cid=document.getElementById('classSel')?.value;if(!cid){document.getElementById('attList').innerHTML='<div class="empty">اختر الصف أولاً.</div>';return}const date=document.getElementById('adate').value,mon=document.getElementById('amonth').value;const arr=db.students.filter(s=>s.classId===cid);const rows=arr.map(s=>{const a=db.attendance.find(x=>x.studentId===s.id&&x.date===date);const st=a?.status||'';return `<div class="student"><div class="avatar">👨‍🎓</div><div class="student-main"><b>${esc(s.name)}</b><small>${st==='present'?'تم تسجيل الحضور':st==='late'?'تم تسجيل التأخير':st==='absent'?'تم تسجيل الغياب':'لم يُسجل بعد'}</small></div><div class="actions"><button class="success" onclick="setAtt('${s.id}','present')">✓ حاضر</button><button class="warning" onclick="setAtt('${s.id}','late')">متأخر</button><button class="danger" onclick="setAtt('${s.id}','absent')">غائب</button></div></div>`}).join('');document.getElementById('attList').innerHTML=`<div class="row no-print" style="margin-bottom:10px"><button class="success" onclick="markAll('present')">✓ تحضير الكل</button><button class="danger" onclick="markAll('absent')">✕ غياب الكل</button><button class="warning" onclick="markAll('late')">تأخير الكل</button></div><div class="list">${rows||'<div class="empty">لا يوجد طلاب في هذا الصف.</div>'}</div>`}
function setAtt(sid,status){const date=document.getElementById('adate').value,mon=document.getElementById('amonth').value;let a=db.attendance.find(x=>x.studentId===sid&&x.date===date);if(a){a.status=status;a.month=mon}else db.attendance.push({id:id(),studentId:sid,date,status,month:mon});save();drawAtt()}
function markAll(status){const cid=document.getElementById('classSel').value,date=document.getElementById('adate').value,mon=document.getElementById('amonth').value;db.students.filter(s=>s.classId===cid).forEach(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===date);if(a){a.status=status;a.month=mon}else db.attendance.push({id:id(),studentId:s.id,date,status,month:mon})});save();drawAtt();showToast('تم تحديث الحضور للجميع')}
function grades(){app.innerHTML=`<div class="hero"><div><h2>الدرجات والمشاركة</h2><p>تسجيل يومي وحساب تلقائي</p></div><button class="secondary" onclick="go('reports')">📊 النتائج</button></div><div class="card"><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر</label><select id="month">${monthList().map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>نوع الإدخال</label><select id="gtype"><option value="participation">🗣️ المشاركة اليومية</option><option value="oral">الشفهي /10</option><option value="quiz">Quiz /10</option><option value="monthly">الشهري /60</option></select></div></div></div><div id="gradeList"></div>`;document.getElementById('classSel').onchange=drawGrades;document.getElementById('month').onchange=drawGrades;document.getElementById('gtype').onchange=drawGrades;drawGrades()}
function drawGrades(){const cid=document.getElementById('classSel')?.value;if(!cid){document.getElementById('gradeList').innerHTML='<div class="card empty">اختر الصف لعرض الطلاب.</div>';return}const typ=document.getElementById('gtype').value,mon=document.getElementById('month').value,arr=db.students.filter(s=>s.classId===cid);if(typ==='participation'){drawParticipation(mon,arr);return}const max=MAX_SCORE[typ];document.getElementById('gradeList').innerHTML=`<div class="card"><div class="section-title"><h3>إدخال ${typ==='oral'?'الشفهي':typ==='quiz'?'Quiz':'الشهري'}</h3><span class="small">الدرجة تُحفظ مباشرة</span></div><div class="list">${arr.map(s=>{const vals=db.grades.filter(g=>g.studentId===s.id&&g.month===mon&&g.type===typ).map(g=>g.value);const v=vals.length?vals[vals.length-1]:'';return `<div class="student"><div class="avatar">📝</div><div class="student-main"><b>${esc(s.name)}</b><small>النتيجة الحالية: ${finalFor(s.id,mon).toFixed(1)} / 100</small></div><div style="width:120px"><input type="number" min="0" max="${max}" step="0.1" value="${v}" placeholder="0 - ${max}" onchange="setGrade('${s.id}',this.value)"></div></div>`}).join('')}</div></div>`}
function drawParticipation(mon,arr){const date=currentDate();document.getElementById('gradeList').innerHTML=`<div class="card"><div class="section-title"><div><h3>🗣️ المشاركة اليومية</h3><span class="small">لم يتم سؤاله لا يدخل في الحساب</span></div><span class="badge blue">الدرجة /10</span></div><label>تاريخ السؤال</label><input type="date" id="pdate" value="${date}"><div class="row" style="margin-top:10px"><button class="success" onclick="markParticipationAll('participated')">🟢 شارك الكل</button><button class="danger" onclick="markParticipationAll('notParticipated')">🔴 لم يشارك الكل</button><button class="secondary" onclick="markParticipationAll('notAsked')">⚪ لم يتم سؤال الكل</button></div></div><div class="list">${arr.map(s=>{const rec=db.participationLog.find(x=>x.studentId===s.id&&x.month===mon&&x.date===date);const st=rec?.status||'notAsked';const sum=participationSummary(s.id,mon);return `<div class="participation-row"><div><b>${esc(s.name)}</b><div class="small" style="margin-top:6px">سُئل ${sum.asked} • شارك ${sum.participated} • لم يشارك ${sum.notParticipated}</div><div style="margin-top:5px"><span class="date-chip">${sum.score.toFixed(2)} / 10</span></div></div><div class="pbuttons"><button class="${st==='participated'?'sel-green':''}" onclick="setParticipationDaily('${s.id}','participated')">شارك</button><button class="${st==='notParticipated'?'sel-red':''}" onclick="setParticipationDaily('${s.id}','notParticipated')">لم يشارك</button><button class="${st==='notAsked'?'sel-gray':''}" onclick="setParticipationDaily('${s.id}','notAsked')">لم يُسأل</button></div><div class="actions" style="grid-column:1/-1"><button class="secondary" onclick="showParticipationHistory('${s.id}','${mon}')">📋 سجل المشاركة</button></div></div>`}).join('')}</div><div class="card"><div class="formula"><b>المعادلة:</b> عدد مرات المشاركة ÷ عدد مرات السؤال × 10<br><span class="small">مثال: سُئل 10 مرات وشارك 5 مرات = 5 / 10. الأيام التي لم يُسأل فيها الطالب لا تدخل في الحساب.</span></div></div>`;document.getElementById('pdate').onchange=drawGrades}
function setParticipationDaily(sid,status){const mon=document.getElementById('month').value,date=document.getElementById('pdate').value;let old=db.participationLog.find(x=>x.studentId===sid&&x.month===mon&&x.date===date);if(old)old.status=status;else db.participationLog.push({id:id(),studentId:sid,month:mon,date,status});save();drawGrades()}
function markParticipationAll(status){const cid=document.getElementById('classSel').value,mon=document.getElementById('month').value,date=document.getElementById('pdate').value;db.students.filter(s=>s.classId===cid).forEach(s=>{let old=db.participationLog.find(x=>x.studentId===s.id&&x.month===mon&&x.date===date);if(old)old.status=status;else db.participationLog.push({id:id(),studentId:s.id,month:mon,date,status})});save();drawGrades();showToast('تم تسجيل المشاركة للجميع')}
function showParticipationHistory(sid,mon){const s=stu(sid),rows=participationLogFor(sid,mon).sort((a,b)=>String(a.date).localeCompare(String(b.date))),sum=participationSummary(sid,mon);open(`<div class="modal-head"><h2>سجل المشاركة</h2><button class="close" onclick="closeM()">✕</button></div><p><b>${esc(s.name)}</b> — ${esc(mon)}</p><div class="stats"><div class="stat"><strong>${sum.asked}</strong><span>تم سؤاله</span></div><div class="stat"><strong>${sum.participated}</strong><span>شارك</span></div><div class="stat"><strong>${sum.notParticipated}</strong><span>لم يشارك</span></div><div class="stat"><strong>${sum.score.toFixed(2)}</strong><span>الدرجة /10</span></div></div><div class="card" style="margin-top:12px"><b>المعادلة:</b> ${sum.participated} ÷ ${sum.asked||0} × 10 = <b>${sum.score.toFixed(2)} / 10</b></div>${rows.length?'<div class="list">'+rows.map(r=>`<div class="student"><div class="avatar">${r.status==='participated'?'🟢':'🔴'}</div><div class="student-main"><b>${formatDateArabic(r.date)}</b><small>${r.status==='participated'?'شارك وأجاب':'تم سؤاله ولم يجب'}</small></div></div>`).join('')+'</div>':'<div class="empty">لا يوجد سجل سؤال لهذا الشهر.</div>'}`)}
function setGrade(sid,v){const typ=document.getElementById('gtype').value,max=MAX_SCORE[typ];const n=Number(v);if(!Number.isFinite(n)||n<0||n>max)return alert(`الدرجة يجب أن تكون بين 0 و ${max}`);db.grades.push({id:id(),studentId:sid,month:document.getElementById('month').value,type:typ,value:n,date:new Date().toISOString()});save();drawGrades();showToast('تم حفظ الدرجة')}
function reports(){app.innerHTML=`<div class="hero"><div><h2>التقارير والنتائج</h2><p>كشف وترتيب الطلاب</p></div><div class="actions"><button class="secondary" onclick="exportCSV()">CSV</button><button class="primary" onclick="printReport()">طباعة</button></div></div><div class="card"><div class="row"><div><label>الصف</label>${classSelect()}</div><div><label>الشهر</label><select id="rmonth">${monthList().map(m=>`<option>${m}</option>`).join('')}<option value="">كل الأشهر</option></select></div></div></div><div id="rep"></div>`;document.getElementById('classSel').onchange=drawRep;document.getElementById('rmonth').onchange=drawRep;drawRep()}
function drawRep(){const cid=document.getElementById('classSel')?.value;if(!cid){document.getElementById('rep').innerHTML='<div class="card empty">اختر الصف لعرض النتائج.</div>';return}const mon=document.getElementById('rmonth').value;const arr=db.students.filter(s=>s.classId===cid).map(s=>({s,score:finalFor(s.id,mon)})).sort((a,b)=>b.score-a.score);document.getElementById('rep').innerHTML=`<div class="card"><div class="section-title"><h3>ترتيب الصف</h3><span class="small">${arr.length} طالب</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>الطالب</th><th>الحضور /10</th><th>المشاركة /10</th><th>الشفهي /10</th><th>Quiz /10</th><th>الشهري /60</th><th>النهائي /100</th><th>الحالة</th></tr></thead><tbody>${arr.map((x,i)=>{const s=x.s,att=weightedScore(attendanceScore(s.id,mon),100,db.settings.weights.attendance),part=weightedScore(participationPercent(s.id,mon),100,db.settings.weights.participation),oral=weightedScore(avgRaw(s.id,'oral',mon),10,db.settings.weights.oral),quiz=weightedScore(avgRaw(s.id,'quiz',mon),10,db.settings.weights.quiz),monthly=weightedScore(avgRaw(s.id,'monthly',mon),60,db.settings.weights.monthly);return `<tr><td>${i+1}</td><td><b>${esc(s.name)}</b></td><td>${att.toFixed(2)}</td><td>${part.toFixed(2)}</td><td>${oral.toFixed(2)}</td><td>${quiz.toFixed(2)}</td><td>${monthly.toFixed(2)}</td><td class="${x.score<db.settings.pass?'bad':'good'}"><b>${x.score.toFixed(1)}</b></td><td><span class="badge ${x.score<db.settings.pass?'warn':'good'}">${statusFor(x.score)}</span></td></tr>`}).join('')}</tbody></table></div></div><div class="stats"><div class="stat"><strong>${arr.length}</strong><span>عدد الطلاب</span></div><div class="stat"><strong>${(arr.length?arr.reduce((a,b)=>a+b.score,0)/arr.length:0).toFixed(1)}</strong><span>متوسط الصف</span></div><div class="stat"><strong>${arr.filter(x=>x.score>=db.settings.pass).length}</strong><span>ناجح</span></div><div class="stat"><strong>${arr.filter(x=>x.score<db.settings.pass).length}</strong><span>يحتاج متابعة</span></div></div>`}
function exportCSV(){const cid=document.getElementById('classSel')?.value,mon=document.getElementById('rmonth')?.value;if(!cid)return alert('اختر الصف');const arr=db.students.filter(s=>s.classId===cid).map(s=>({s,score:finalFor(s.id,mon)})).sort((a,b)=>b.score-a.score);const lines=[['الترتيب','الطالب','الحضور /10','المشاركة /10','الشفهي /10','Quiz /10','الشهري /60','النهائي /100','الحالة']];arr.forEach((x,i)=>{const s=x.s;lines.push([i+1,s.name,weightedScore(attendanceScore(s.id,mon),100,db.settings.weights.attendance).toFixed(2),weightedScore(participationPercent(s.id,mon),100,db.settings.weights.participation).toFixed(2),weightedScore(avgRaw(s.id,'oral',mon),10,db.settings.weights.oral).toFixed(2),weightedScore(avgRaw(s.id,'quiz',mon),10,db.settings.weights.quiz).toFixed(2),weightedScore(avgRaw(s.id,'monthly',mon),60,db.settings.weights.monthly).toFixed(2),x.score.toFixed(1),statusFor(x.score)])});const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='كشف_درجات_الأستاذ_عباس.csv';a.click()}
function printReport(){window.print()}
function studentCard(sid){const s=stu(sid);if(!s)return;const mon=previousMonthName();const score=finalFor(sid,mon),sum=participationSummary(sid,mon),abs=absenceDates(sid,mon);const grades=[['الحضور',weightedScore(attendanceScore(sid,mon),100,db.settings.weights.attendance),10],['المشاركة',sum.score,10],['الشفهي',weightedScore(avgRaw(sid,'oral',mon),10,db.settings.weights.oral),10],['Quiz',weightedScore(avgRaw(sid,'quiz',mon),10,db.settings.weights.quiz),10],['الشهري',weightedScore(avgRaw(sid,'monthly',mon),60,db.settings.weights.monthly),60]];open(`<div class="modal-head"><h2>كشف الطالب</h2><button class="close" onclick="closeM()">✕</button></div><div class="student"><div class="avatar">👨‍🎓</div><div class="student-main"><b>${esc(s.name)}</b><small>${esc(cls(s.classId)?.name||'')}</small><span class="badge ${score<db.settings.pass?'warn':'good'}">${statusFor(score)}</span></div><div class="score-big">${score.toFixed(1)}<small style="font-size:12px;color:#8994a5"> /100</small></div></div><div class="card" style="margin-top:12px"><div class="section-title"><h3>${esc(mon)}</h3><span class="small">النتيجة النهائية</span></div>${grades.map(g=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f5"><span>${g[0]}</span><b>${g[1].toFixed(2)} / ${g[2]}</b></div>`).join('')}</div><div class="card"><h3>🚫 الغياب</h3>${abs.length?abs.map(d=>`<span class="date-chip">${formatDateArabic(d)}</span>`).join(''):'<span class="small">لا توجد أيام غياب.</span>'}</div><div class="card"><h3>🗣️ المشاركة</h3><p class="small">تم سؤاله ${sum.asked} • شارك ${sum.participated} • لم يشارك ${sum.notParticipated}</p>${sum.rows.length?sum.rows.map(r=>`<span class="date-chip">${formatDateArabic(r.date)} — ${r.status==='participated'?'شارك':'لم يشارك'}</span>`).join(''):'<span class="small">لا يوجد سجل.</span>'}</div><label>📱 رقم واتساب ولي الأمر</label><input id="editPhone" value="${esc(s.phone||'')}" placeholder="07701234567"><div class="row" style="margin-top:12px"><button class="primary" onclick="saveStudentPhone('${sid}')">حفظ الرقم</button><button class="wa" onclick="shareMonthlyReport('${sid}','${mon}')">📲 واتساب</button></div>`)}
function saveStudentPhone(sid){const p=normalizePhone(document.getElementById('editPhone').value);if(p&&!/^9647\d{9}$/.test(p))return alert('رقم واتساب غير صحيح');stu(sid).phone=p;save();studentCard(sid);showToast('تم حفظ الرقم')}
function participationReportText(sid,month){const s=participationSummary(sid,month);if(!s.rows.length)return 'لم يتم تسجيل أي سؤال للطالب في هذا الشهر.';return `تم سؤال الطالب ${s.asked} مرات: شارك ${s.participated} مرات، ولم يشارك ${s.notParticipated} مرات.\n`+s.rows.sort((a,b)=>a.date.localeCompare(b.date)).map((r,i)=>`${i+1}. ${formatDateArabic(r.date)} — ${r.status==='participated'?'شارك وأجاب':'تم سؤاله ولم يجب'}`).join('\n')}
function reportMessageFor(sid,month){const s=stu(sid),c=cls(s.classId),att=weightedScore(attendanceScore(sid,month),100,db.settings.weights.attendance),part=participationSummary(sid,month).score,oral=weightedScore(avgRaw(sid,'oral',month),10,db.settings.weights.oral),quiz=weightedScore(avgRaw(sid,'quiz',month),10,db.settings.weights.quiz),monthly=weightedScore(avgRaw(sid,'monthly',month),60,db.settings.weights.monthly),final=finalFor(sid,month),abs=absenceDates(sid,month);const absenceText=abs.length?abs.map((d,i)=>`${i+1}. ${formatDateArabic(d)}`).join('\n'):'لا توجد أيام غياب مسجلة.';return `📊 التقرير الشهري للطالب\n\n👨‍🎓 الطالب: ${s.name}\n🏫 الصف: ${c?.name||'غير محدد'}\n🏫 المدرسة: مدرسة محمد ابن أبي بكر\n📅 الشهر: ${month}\n\n━━━━━━━━━━━━━━\n📌 الدرجات\n━━━━━━━━━━━━━━\n📅 الحضور: ${att.toFixed(2)} / ${db.settings.weights.attendance}\n🚫 أيام الغياب: ${abs.length}\n📆 تواريخ الغياب:\n${absenceText}\n\n🗣️ الشفهي: ${oral.toFixed(2)} / ${db.settings.weights.oral}\n📝 Quiz: ${quiz.toFixed(2)} / ${db.settings.weights.quiz}\n🙋 المشاركة: ${part.toFixed(2)} / 10\n📋 تفاصيل المشاركة اليومية:\n${participationReportText(sid,month)}\n\n📚 الشهري: ${monthly.toFixed(2)} / ${db.settings.weights.monthly}\n\n━━━━━━━━━━━━━━\n📊 النتيجة النهائية\n━━━━━━━━━━━━━━\nالدرجة النهائية: ${final.toFixed(1)} / 100\nالحالة: ${statusFor(final)}\n\n📝 ملاحظات الأستاذ\nالتقرير يوضح مستوى الحضور والدرجات والنشاط خلال الشهر.\n\nمع تمنياتنا للطالب بالمزيد من التقدم والنجاح.\n\n👨‍🏫 الأستاذ: عباس عناد\n📘 مادة اللغة الإنجليزية\n🏫 مدرسة محمد ابن أبي بكر`}
function waLinkFor(sid,month){const s=stu(sid);return s?.phone?'https://wa.me/'+normalizePhone(s.phone)+'?text='+encodeURIComponent(reportMessageFor(sid,month)):''}
function openWhatsApp(sid){return shareMonthlyReport(sid,previousMonthName())}
async function shareMonthlyReport(sid,month){const s=stu(sid);if(!s)return;if(!s.phone){if(confirm('لا يوجد رقم واتساب. هل تريد إضافته الآن؟'))studentCard(sid);return}const url=waLinkFor(sid,month||previousMonthName());open(`<div class="modal-head"><h2>📲 إرسال عبر واتساب</h2><button class="close" onclick="closeM()">✕</button></div><p class="small">تم تجهيز التقرير. اضغط الزر لفتح واتساب.</p><a class="wa wide" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">فتح واتساب وإرسال التقرير</a><button class="secondary wide" style="margin-top:8px" onclick="closeM()">إغلاق</button>`)}
function previousMonthName(){const idx=new Date().getMonth()-1;return monthList()[idx<0?monthList().length-1:Math.min(idx,monthList().length-1)]}
function batchQueue(){try{return JSON.parse(localStorage.getItem('abbas_batch_queue')||'null')}catch(e){return null}}
function saveBatch(q){localStorage.setItem('abbas_batch_queue',JSON.stringify(q))}
function clearBatch(){localStorage.removeItem('abbas_batch_queue')}
function startBatchReports(){const eligible=db.students.filter(s=>s.phone);const missing=db.students.filter(s=>!s.phone);open(`<div class="modal-head"><h2>📤 إرسال التقارير دفعة واحدة</h2><button class="close" onclick="closeM()">✕</button></div><label>الشهر</label><select id="batchMonth">${monthList().map(m=>`<option ${m===previousMonthName()?'selected':''}>${m}</option>`).join('')}</select><div class="stats" style="margin-top:12px"><div class="stat"><strong>${eligible.length}</strong><span>جاهز للإرسال</span></div><div class="stat"><strong>${missing.length}</strong><span>بدون رقم</span></div></div><div class="formula" style="margin-top:12px">سيتم فتح تقرير كل طالب بالتتابع. المتصفح وواتساب لا يسمحان لموقع ويب بإرسال رسائل جماعية في الخلفية دون تأكيد المستخدم.</div><button class="primary wide" style="margin-top:12px" onclick="confirmBatchStart()">🚀 بدء الإرسال</button>`)}
function confirmBatchStart(){const month=document.getElementById('batchMonth').value,students=db.students.filter(s=>s.phone).map(s=>s.id);if(!students.length)return alert('لا يوجد طلاب لديهم أرقام واتساب');saveBatch({month,index:0,students,startedAt:new Date().toISOString()});closeM();openBatchProgress()}
function openBatchProgress(){const q=batchQueue();if(!q)return;const total=q.students.length,done=Math.min(q.index,total),current=done<total?stu(q.students[done]):null;open(`<div class="modal-head"><h2>📤 إرسال التقارير</h2><button class="close" onclick="closeM()">✕</button></div><p>تم فتح <b>${done}</b> من <b>${total}</b></p><div class="progress"><i style="width:${(done/total*100).toFixed(1)}%"></i></div><p class="small">الشهر: ${esc(q.month)}</p>${current?`<div class="student"><div class="avatar">📤</div><div class="student-main"><b>التالي: ${esc(current.name)}</b><small>اضغط فتح التقرير، ثم أرسل الرسالة في واتساب، وبعد العودة اضغط التالي.</small></div></div><button class="wa wide" style="margin-top:10px" onclick="openNextBatch()">📲 فتح التقرير التالي</button>`:'<div class="card"><b>✅ اكتملت الدفعة</b></div>'}<button class="secondary wide" style="margin-top:8px" onclick="closeM()">إغلاق</button>`)}
function openNextBatch(){const q=batchQueue();if(!q)return;if(q.index>=q.students.length){clearBatch();showToast('اكتملت جميع التقارير');openBatchProgress();return}const sid=q.students[q.index];q.index++;saveBatch(q);const url=waLinkFor(sid,q.month);if(url)window.location.href=url;setTimeout(()=>openBatchProgress(),600)}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='نسخة_احتياطية_الأستاذ_عباس.json';a.click();showToast('تم تجهيز النسخة الاحتياطية')}
function restore(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.classes||!x.students)throw Error();db=Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)),x);db.settings.weights=Object.assign({},DEFAULT_DB.settings.weights,x.settings?.weights||{});db.participationLog=x.participationLog||[];save();render();showToast('تمت استعادة البيانات')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
function settings(){const w=db.settings.weights;app.innerHTML=`<div class="hero"><div><h2>الإعدادات</h2><p>الأوزان والنسخ الاحتياطي</p></div></div><div class="card"><div class="section-title"><h3>أوزان الدرجات</h3><span class="badge blue">المجموع 100%</span></div><div class="stats">${[['attendance','الحضور'],['participation','المشاركة'],['oral','الشفهي'],['quiz','Quiz'],['monthly','الشهري']].map(([k,n])=>`<div><label>${n}</label><input id="w_${k}" type="number" min="0" max="100" value="${w[k]}"></div>`).join('')}</div><label>درجة النجاح</label><input id="pass" type="number" min="0" max="100" value="${db.settings.pass}"><button class="primary wide" style="margin-top:12px" onclick="saveSettings()">حفظ الإعدادات</button></div><div class="card"><div class="section-title"><h3>النسخ الاحتياطي</h3><span>💾</span></div><div class="row"><button class="primary" onclick="backup()">⬇️ تصدير نسخة</button><label class="secondary" style="text-align:center;cursor:pointer">⬆️ استعادة نسخة<input type="file" accept=".json" onchange="restore(this)" style="display:none"></label></div></div><div class="card"><div class="section-title"><h3>إعادة الضبط</h3><span>⚠️</span></div><button class="danger wide" onclick="resetAll()">حذف كل بيانات التطبيق</button></div>`}
function saveSettings(){const keys=['attendance','participation','oral','quiz','monthly'];const vals=keys.map(k=>Number(document.getElementById('w_'+k).value));if(vals.some(v=>!Number.isFinite(v)||v<0)||Math.round(vals.reduce((a,b)=>a+b,0))!==100)return alert('مجموع الأوزان يجب أن يساوي 100%');keys.forEach(k=>db.settings.weights[k]=Number(document.getElementById('w_'+k).value));db.settings.pass=Number(document.getElementById('pass').value);save();render();showToast('تم حفظ الإعدادات')}
function resetAll(){if(confirm('سيتم حذف جميع البيانات من هذا الهاتف. هل أنت متأكد؟')){localStorage.removeItem(KEY);location.reload()}}
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
